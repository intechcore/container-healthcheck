name: Release

# bump-version.yml pushes the v* tag. The image, the binaries and the GitHub
# release follow from it; no release is created by hand.
#
# Each architecture is built on a native runner, tested, and pushed exactly as
# tested: the push takes its layers from the local builder cache of the tested
# build, by digest. The publish job joins both digests into the tagged index.
# The binaries of the release are copied out of the tested images.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/intechcore/container-healthcheck

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The notes come from the CHANGELOG.md section that bump-version.yml cut.
      # A tag without that section fails here, before anything is pushed.
      - name: Read the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p notes
          .github/scripts/changelog-section.sh "$VERSION" "$GITHUB_REPOSITORY" > notes/release-notes.md

      # Releases are immutable: the release gets all its files in one create
      # call. A tag that has a release already stops here, before the push.
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only "not found" (HTTP 404) lets the release go on. Any other lookup
          # error stops it too, so an API failure never reads as "no release".
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1); then
            echo "::error::Release $GITHUB_REF_NAME exists. Releases are immutable: release a new version."
            exit 1
          fi
          case "$out" in
            *"(HTTP 404)"*) echo "No release $GITHUB_REF_NAME yet." ;;
            *) echo "::error::Cannot look up release $GITHUB_REF_NAME: $out"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=container-healthcheck
            org.opencontainers.image.description=Static healthcheck binary for container images: plain HTTP or verified HTTPS over loopback
            org.opencontainers.image.vendor=Intechcore GmbH
            org.opencontainers.image.authors=Intechcore GmbH
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/intechcore/container-healthcheck#readme
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: container-healthcheck:test
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}

      - name: Check the version of the binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          actual="$(docker run --rm container-healthcheck:test --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::The binary reports $actual, the release is $VERSION"
            exit 1
          fi

      - name: Container test
        run: tests/container/test.sh container-healthcheck:test

      # Same context, labels and build arguments as the tested build, so every
      # layer comes from the local builder cache. No cache-from here: a remote
      # cache could hand in a layer that was not tested.
      - name: Push the tested image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The SBOM lists what the tested image carries: the binary and its Go
      # build information. It is attached to the platform image.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: container-healthcheck:test
          format: spdx-json
          output-file: container-healthcheck-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: container-healthcheck-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json
          push-to-registry: true

      # The binary of the release is the one in the tested image
      - name: Collect the binary, the SBOM and the digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p out
          container="$(docker create container-healthcheck:test)"
          docker cp "${container}:/container-healthcheck" "out/container-healthcheck-linux-${ARCH}"
          docker rm "${container}" >/dev/null
          mv "container-healthcheck-${GITHUB_REF_NAME}-linux-${ARCH}.spdx.json" out/
          echo "${DIGEST}" > "out/digest-${ARCH}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: out
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version, its major.minor and latest point at one index with both
      # tested platform images.
      - name: Tag the index
        id: index
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          minor="${VERSION%.*}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${minor}" -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat out/digest-amd64)" "${IMAGE}@$(cat out/digest-arm64)"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signs which workflow built the image, from which commit. Users check
      # it with: gh attestation verify oci://<image> --owner intechcore
      - name: Attest the build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Checksums of the binaries
        run: |
          cd out
          sha256sum container-healthcheck-linux-amd64 container-healthcheck-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      # Users check a binary with: gh attestation verify <file> --repo intechcore/container-healthcheck
      - name: Attest the build provenance of the binaries
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/container-healthcheck-linux-amd64
            out/container-healthcheck-linux-arm64

      # Scorecard Signed-Releases reads release assets only. The next job
      # creates the release with the binaries, the provenance and the SBOMs.
      - name: Collect the release assets
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir -p assets
          cp out/container-healthcheck-linux-* out/SHA256SUMS out/*.spdx.json assets/
          cp "$BUNDLE" "assets/container-healthcheck-${GITHUB_REF_NAME}.intoto.jsonl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 1

  # A separate job, so only the release holds contents: write.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      # Releases are immutable: the release gets all files in this one call.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* --notes-file notes/release-notes.md \
            --title "$TAG" --verify-tag --repo "$REPO"
